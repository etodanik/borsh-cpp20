name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            os: ubuntu-latest
            compiler: -DCMAKE_CXX_COMPILER=g++
          - name: LLVM Clang
            os: ubuntu-latest
            compiler: -DCMAKE_CXX_COMPILER=clang++
          - name: Apple Clang
            os: macos-latest
            compiler: -DCMAKE_CXX_COMPILER=clang++
          - name: MSVC
            os: windows-latest
            compiler: ""

    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_SKIP_INSTALL_RULES=ON
          -DBORSH_BUILD_EXAMPLES=OFF
          -DBORSH_BUILD_TESTS=ON
          -DBORSH_USE_WARNINGS_AS_ERRORS=ON
          ${{ matrix.compiler }}
      - name: Build
        run: cmake --build build --config Debug --parallel
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
